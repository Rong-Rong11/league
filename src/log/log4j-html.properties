log4j.rootLogger=INFO, HTML_FILE

log4j.appender.HTML_FILE=org.apache.log4j.FileAppender
log4j.appender.HTML_FILE.File=src/log/application.html
log4j.appender.HTML_FILE.Append=false
log4j.appender.HTML_FILE.layout=org.apache.log4j.HTMLLayout
log4j.appender.HTML_FILE.layout.Title=League Application Logs
log4j.appender.HTML_FILE.layout.LocationInfo=true
