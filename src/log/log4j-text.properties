log4j.rootLogger=INFO, TEXT_FILE

log4j.appender.TEXT_FILE=org.apache.log4j.FileAppender
log4j.appender.TEXT_FILE.File=src/log/application.txt
log4j.appender.TEXT_FILE.Append=true
log4j.appender.TEXT_FILE.layout=org.apache.log4j.PatternLayout
log4j.appender.TEXT_FILE.layout.ConversionPattern=%d{ISO8601} %-5p [%c] - %m%n
